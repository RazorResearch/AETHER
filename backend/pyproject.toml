[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-engine"
version = "0.1.0"
description = "AETHER engine — Adaptive AI Optimization Platform (RazorResearch)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "RazorResearch" }]
# Every dependency is under a permissive licence compatible with Apache-2.0
# (see docs/ARCHITECTURE.md, "Dependencies and licences").
dependencies = [
    "fastapi>=0.115",        # MIT
    "uvicorn>=0.30",         # BSD-3-Clause
    "pydantic>=2.7",         # MIT
    "psutil>=5.9",           # BSD-3-Clause
    "nvidia-ml-py>=12.535",  # BSD-3-Clause
    "numpy>=1.26",           # BSD-3-Clause
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
torch = ["torch>=2.3"]       # BSD-3-Clause, optional research engine
eval = ["lm-eval>=0.4"]      # MIT, optional quality benchmarks

[project.scripts]
aether-engine = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
